[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-that-talks-back"
version = "0.1.0"
description = "Turn any GitHub repository into an interactive assistant with file+line citations."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Repo That Talks Back Contributors"}]

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "groq",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx",
]

[project.scripts]
rtalk = "rtalk.__main__:main"

[tool.setuptools.packages.find]
include = ["rtalk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
